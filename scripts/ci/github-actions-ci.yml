# Move this file to .github/workflows/ci.yml (remote tools cannot write there).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint, tests, migrations, OpenAPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Throwaway CI database, not a real credential.
          POSTGRES_USER: fieldops
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: fieldops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fieldops -d fieldops_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_TYPE: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: fieldops
      DB_PASSWORD: ci-only-password
      DB_NAME: fieldops_test
      CORS_ORIGINS: http://localhost:3001
      JWT_ACCESS_SECRET: ci-only-access-secret-0123456789
      JWT_REFRESH_SECRET: ci-only-refresh-secret-012345678
      AUTH_TEST_LOGIN_ENABLED: "true"
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Migrations (test database)
        run: NODE_ENV=test npm run migration:run
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Export OpenAPI contract
        run: npm run openapi:export
      - name: OpenAPI contract is committed and current
        working-directory: .
        run: |
          if git ls-files --error-unmatch openapi/openapi.json >/dev/null 2>&1; then
            git diff --exit-code openapi/openapi.json || (echo "Run 'npm run api:sync' and commit openapi/" && exit 1)
          else
            echo "openapi/openapi.json not committed yet - skipping drift check"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi/openapi.json

  web:
    name: Web (Next.js) - generated client, typecheck, lint, build
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: web/fieldops-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: openapi
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Regenerate API types
        run: npm run api:types
      - name: Generated client is committed and current
        run: git diff --exit-code src/api/generated || (echo "Run 'npm run api:sync' and commit the generated client" && exit 1)
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000

  mobile-client:
    name: Mobile - generate Dart API client
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: openapi
      - name: Install root tools
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Generate Dart client
        run: npm run api:clients -- --dart
      - name: Generated client is committed and current
        run: |
          if git ls-files --error-unmatch mobile/fieldops_mobile/packages/fieldops_api/pubspec.yaml >/dev/null 2>&1; then
            git diff --exit-code mobile/fieldops_mobile/packages/fieldops_api || (echo "Run 'npm run api:sync' and commit the Dart client" && exit 1)
          else
            echo "Dart client not committed yet - skipping drift check"
          fi
