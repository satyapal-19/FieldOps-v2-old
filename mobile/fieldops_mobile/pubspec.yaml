name: fieldops_mobile
description: FieldOps SMKMC - Geo-tagged Field Attendance & Presence System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase (Backend-as-a-Service)
  supabase_flutter: ^2.8.4

  # State Management
  get: ^4.6.6

  # Auth & Security
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Camera & Location
  camera: ^0.11.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # AI Face Detection (on-device)
  google_mlkit_face_detection: ^0.11.0

  # Offline Storage
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Background Tasks
  workmanager: ^0.10.10

  # QR Scanner
  mobile_scanner: ^5.2.3

  # Networking
  connectivity_plus: ^6.1.1
  dio: ^5.7.0

  # UI
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  shimmer: ^3.0.0
  lottie: ^3.1.3
  flutter_animate: ^4.5.0
  gap: ^3.0.1

  # Utils
  uuid: ^4.5.1
  crypto: ^3.0.5
  device_info_plus: ^10.1.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.0


  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.3
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/images/

